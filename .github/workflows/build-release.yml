name: Android Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release_output
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp app/build/outputs/apk/debug/app-debug.apk "release_output/Kenten-LLM-${TAG_NAME}.apk"

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*.apk
          name: Kenten LLM ${{ github.ref_name }}
          body: |
            ## Kenten LLM Official Release ${{ github.ref_name }}
            
            - **Developer:** Hunter zen RU
            - **Repository:** https://github.com/hunter-zen-RU/kenten-llm
            - **App Feature Suite:** Offline GGUF inference, hands-free voice mode, ambient edge lighting overlay, local OpenAI API server (:8080), and hardware benchmarks.
            
            ### Installation
            Download the `Kenten-LLM-*.apk` asset below and install directly on your Android device!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
